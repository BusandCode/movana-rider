name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Expo
        run: npx expo install --fix

      - name: Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package into an IPA
        run: |
          cd ios
          APP_PATH=$(find ./build/Build/Products/Debug-iphoneos -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p ./build/Payload
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r movana-rider.ipa ./Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: movana-rider-unsigned-ipa
          path: ./ios/build/movana-rider.ipa
          retention-days: 30
